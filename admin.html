<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameDay+ Sign In</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="panel auth-panel">
      <p class="eyebrow">GameDay+</p>
      <h1>Sign in</h1>
      <p class="muted">Manage the public schedule for your school.</p>
      <form id="loginForm">
        <label>Email
          <input id="emailInput" name="email" type="email" required autocomplete="username" />
        </label>
        <label>Password
          <input id="passwordInput" name="password" type="password" required autocomplete="current-password" />
        </label>
        <button class="primary" type="submit">Sign in</button>
        <p id="loginError" class="error" role="alert"></p>
      </form>
      <div class="auth-divider"><span>or continue with</span></div>
      <button id="googleSignInBtn" class="secondary google-btn" type="button">Sign in with Google</button>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/firebase-client.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>

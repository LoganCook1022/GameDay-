<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameDay+ Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="panel auth-panel">
      <p class="eyebrow">GameDay+</p><h1>Administrator sign in</h1>
      <p class="muted">Manage the public schedule for your school.</p>
      <form id="loginForm"><label>Email<input id="emailInput" type="email" required autocomplete="email"></label><label>Password<input id="passwordInput" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Sign in</button><p id="loginError" class="error" role="alert"></p></form>
      <div class="auth-divider"><span>or continue with</span></div>
      <button id="googleSignInBtn" class="secondary google-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Sign in with Google</span>
      </button>
    </section>
    <section id="dashboardView" hidden>
      <header class="admin-header"><div><p class="eyebrow">GameDay+ Admin</p><h1>School operations</h1></div><button id="signOutBtn" class="secondary">Sign out</button></header>
      <nav class="tabs" aria-label="Admin sections"><button class="tab active" data-section="overview">Dashboard</button><button class="tab" data-section="events">Events</button><button class="tab" data-section="sports">Sports</button><button class="tab" data-section="clubs">Clubs</button><button class="tab" data-section="teams">Teams</button><button class="tab" data-section="statistics">Statistics</button><button class="tab" data-section="settings">School Settings</button></nav>
      <div id="adminContent" class="admin-content"></div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="admin.js"></script>
</body>
</html>

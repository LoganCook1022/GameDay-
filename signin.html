<!DOCTYPE html>
<html lang="en" data-theme="spirit">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b315d">
  <title>Sign In | GameDay+</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="signin.css">
</head>
<body>
  <main class="signin-shell">
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to GameDay+</a>

    <section class="signin-card">
      <!-- Auth Form View -->
      <div id="authCard">
        <div class="signin-brand">
          <div class="brand-badge"><i class="fa-solid fa-trophy"></i></div>
          <div>
            <h1>GameDay<span>+</span></h1>
            <p>High School Sports &amp; Event Hub</p>
          </div>
        </div>

        <div class="auth-mode-toggle" id="authModeToggle">
          <button type="button" class="auth-mode-btn active" data-mode="signin">Sign In</button>
          <button type="button" class="auth-mode-btn" data-mode="create">Create Account</button>
        </div>

        <form class="signin-form" id="authForm" novalidate>
          <label class="signin-field">
            Email
            <input type="email" id="emailInput" required autocomplete="email" placeholder="you@example.com">
          </label>
          <label class="signin-field">
            Password
            <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="At least 6 characters">
          </label>
          <p class="error-msg" id="authError" role="alert"></p>
          <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
        </form>

        <div class="divider"><span>or continue with</span></div>

        <button type="button" class="btn-google" id="googleBtn">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </button>

        <p class="signin-note">Signing in doesn't change what you see. An account just lets you come back and stay signed in.</p>
      </div>

      <!-- Signed In View -->
      <div class="signed-in-view" id="signedInCard" hidden>
        <div class="signed-in-avatar" id="userAvatar"></div>
        <h2>Signed in</h2>
        <p id="signedInEmail"></p>
        <p id="signedInRole"></p>
        <div class="signed-in-actions">
          <a href="index.html" class="btn-primary" id="continueBtn" style="text-decoration:none;">Continue to App</a>
          <a href="admin.html" class="admin-link" id="adminDashboardLink" hidden><i class="fa-solid fa-table-columns"></i> Go to Admin Dashboard</a>
          <button type="button" class="btn-secondary" id="signOutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</button>
        </div>
      </div>
    </section>

    <footer class="signin-footer">GameDay+ &bull; No login needed to view schedules</footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-client.js"></script>
  <script src="signin.js"></script>
</body>
</html>
